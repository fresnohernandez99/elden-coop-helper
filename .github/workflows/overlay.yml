name: Overlay (Windows)

# Builds the Windows installer of the overlay app in overlay/.
# - Manual run (Actions tab → Run workflow): the installer is attached to the run as an artifact.
# - Pushing a tag like overlay-v1.0.0: it is also published as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['overlay-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: overlay/src-tauri -> target

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: elden-coop-overlay-setup
          path: overlay/src-tauri/target/release/bundle/nsis/*.exe

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: overlay/src-tauri/target/release/bundle/nsis/*.exe

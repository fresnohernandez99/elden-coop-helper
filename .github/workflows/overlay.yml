name: Overlay (Windows)

# Builds the Windows installer of the overlay app in overlay/ on every push to
# master that touches it, and publishes it as a release candidate (pre-release)
# tagged overlay-v<version>-rc.<run number>.
on:
  push:
    branches: [master]
    paths:
      - 'overlay/**'
      - '.github/workflows/overlay.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: overlay/src-tauri -> target

      - run: npm ci
      - run: npm run build

      - id: version
        shell: bash
        run: echo "tag=overlay-v$(node -p "require('./src-tauri/tauri.conf.json').version")-rc.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Elden Co-op Overlay ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: overlay/src-tauri/target/release/bundle/nsis/*.exe
